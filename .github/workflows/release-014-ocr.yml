name: Verifica e pubblica PDFicina Scan 0.1.14 OCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-014-ocr.yml']
permissions:
  contents: write
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Android build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Recupera ZIP firmato con SHA256
        shell: bash
        run: |
          set -euo pipefail
          ID="1SDZflctXpdF3jdqDY7f9ceAWu8T07LFy"
          EXPECTED="47df1229d8ea4d38f4d6d54ac484c919f6f692539dff1bbf76d4c93ca796c5df"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 3 --connect-timeout 30 "$URL" -o signed.zip; then
              if echo "$EXPECTED  signed.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  signed.zip" | sha256sum -c -
          unzip -tq signed.zip
          mkdir -p release
          unzip -q signed.zip -d release
          (cd release && sha256sum -c SHA256_APK.txt)
      - name: Controlli apksigner aapt modelli ARM64
        shell: bash
        run: |
          set -euo pipefail
          APK=release/PDFicinaScan_0.1.14_GalaxyS24.apk
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs "$APK" | tee signature.txt
          grep -qi "7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236" signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee metadata.txt
          grep -F "versionCode='15'" metadata.txt
          grep -F "versionName='0.1.14'" metadata.txt
          grep -F "name='it.pdficina.scan'" metadata.txt
          unzip -Z1 "$APK" | grep -qx 'assets/tessdata/ita.traineddata'
          unzip -Z1 "$APK" | grep -qx 'assets/tessdata/eng.traineddata'
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libtesseract.so'
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libleptonica.so'
          if unzip -Z1 "$APK" | grep -q 'lib/armeabi-v7a/'; then echo 'WARN includes 32-bit compatibility files'; fi
      - name: Pubblica release APK verificata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.14-prealfa
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/PDFicinaScan_0.1.14_GalaxyS24.apk release/SHA256_APK.txt --clobber
          else
            gh release create "$TAG" release/PDFicinaScan_0.1.14_GalaxyS24.apk release/SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.14 PRE-ALFA - OCR offline" --notes "Schede compatte, OCR offline italiano/inglese tramite Tesseract4Android e tessdata_fast (Apache-2.0), pulsante OCR copia testo per pagina; PDF ricercabile sperimentale opzionale. Immagini e documenti rimangono sul dispositivo. Fotocamera invariata. APK firmato con il certificato release 0.1.13. Test fisici S24 ancora necessari. Licenze: https://github.com/adaptech-cz/Tesseract4Android e https://github.com/tesseract-ocr/tessdata_fast" --prerelease
          fi
