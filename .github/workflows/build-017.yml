name: PDFicina Scan 0.1.7 - Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-017.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Scarica sorgenti ZIP verificati
        shell: bash
        run: |
          set -euo pipefail
          ID="1CG9YJECxwyQCXnsDpDZn2_TXluymSfAZ"
          EXPECTED="d573096a8b876522062ab77d36a0358e94f7d71262fde2bf98afcca38673bb90"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
          test -f PDFicinaScan_0.1.7/app/build.gradle
      - name: JVM test completo
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.7
          mkdir -p build/tests
          javac -d build/tests             app/src/main/java/it/pdficina/scan/{PerspectiveMath,FileNames,EdgeDetector,ArchiveNames,CaptureBatch,DocumentEnhancer}.java             tests/{PerspectiveMathTest,FileNamesTest,EdgeDetectorTest,ArchiveNamesTest,CaptureBatchTest,DocumentEnhancerTest}.java
          for t in PerspectiveMathTest FileNamesTest EdgeDetectorTest ArchiveNamesTest CaptureBatchTest DocumentEnhancerTest; do java -cp build/tests "it.pdficina.scan.$t"; done
          python3 tests/camera-regression-check.py
          python3 tests/consecutive-regression-check.py
          python3 tests/test_sign_v2.py
      - name: Compila APK release
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.7
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Controllo ZIP e DEX
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.7/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -qx classes.dex
          mkdir -p output
          cp "$APK" output/PDFicinaScan_0.1.7_UNSIGNED.apk
          (cd output && sha256sum PDFicinaScan_0.1.7_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan-0.1.7-UNSIGNED
          path: output/*
          if-no-files-found: error
