name: Verifica e pubblica PDFicina Scan 0.1.11
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-0111.yml']
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: ZIPMASTER staging verificato
        shell: bash
        run: |
          set -euo pipefail
          ID="1-JA_KFrPiguuhyVfai8Aze7DgpvPnxk3"
          EXPECTED="2fa7e07b43ddb32526cf20e34e804ee02631b47538da9632e4c18f696e5d6b66"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o official_staging.zip; then
              if echo "$EXPECTED  official_staging.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  official_staging.zip" | sha256sum -c -
          unzip -tq official_staging.zip
          unzip -q official_staging.zip "PDFicinaScan_0.1.11/release/*"
          mkdir -p release
          cp PDFicinaScan_0.1.11/release/PDFicinaScan_0.1.11_GalaxyS24.apk release/
          cp PDFicinaScan_0.1.11/release/SHA256_APK.txt release/
          (cd release && sha256sum -c SHA256_APK.txt)
      - name: Firma Android ufficiale e versione
        shell: bash
        run: |
          set -euo pipefail
          APK=release/PDFicinaScan_0.1.11_GalaxyS24.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs "$APK" | tee cert.txt
          grep -qi '7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236' cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -F "versionCode='12'" badging.txt
          grep -F "versionName='0.1.11'" badging.txt
          grep -F "name='it.pdficina.scan'" badging.txt
          unzip -tq "$APK"
      - name: Pubblica APK scaricabile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.11-prealfa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/PDFicinaScan_0.1.11_GalaxyS24.apk release/SHA256_APK.txt --clobber
          else
            gh release create "$TAG" release/PDFicinaScan_0.1.11_GalaxyS24.apk release/SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.11 — Inquadratura corretta" --notes "Preview Camera2 e cornice ora fisicamente separate dal pannello comandi. Griglia opzionale a terzi e timer 3 secondi annullabile. Stessa chiave release 0.1.4+. Compilazione/test superati; collaudo fisico S24 richiesto." --prerelease
          fi
