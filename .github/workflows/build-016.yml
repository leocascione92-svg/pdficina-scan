name: PDFicina Scan 0.1.6 - Build e test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-016.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Installa SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Scarica sorgenti con checksum
        shell: bash
        run: |
          set -euo pipefail
          ID=1Ocy7yMfUon8T2XGG-6vC7yE5nBXgclCa
          EXPECTED=d9136be212e0474979329023fe5f7f2da1012190b4cdcaf1db54c836e1c9d658
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
      - name: Test logici e regressioni
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.6
          mkdir -p build/testclasses
          javac -d build/testclasses app/src/main/java/it/pdficina/scan/PerspectiveMath.java app/src/main/java/it/pdficina/scan/FileNames.java app/src/main/java/it/pdficina/scan/EdgeDetector.java app/src/main/java/it/pdficina/scan/ArchiveNames.java tests/PerspectiveMathTest.java tests/FileNamesTest.java tests/EdgeDetectorTest.java tests/ArchiveNamesTest.java
          java -cp build/testclasses it.pdficina.scan.PerspectiveMathTest
          java -cp build/testclasses it.pdficina.scan.FileNamesTest
          java -cp build/testclasses it.pdficina.scan.EdgeDetectorTest
          java -cp build/testclasses it.pdficina.scan.ArchiveNamesTest
          python3 tests/camera-regression-check.py
          python3 tests/test_sign_v2.py
      - name: Compila release unsigned
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.6
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verifica DEX e prepara artefatto
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.6/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -qx classes.dex
          mkdir -p output
          cp "$APK" output/PDFicinaScan_0.1.6_UNSIGNED.apk
          (cd output && sha256sum PDFicinaScan_0.1.6_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan_0.1.6_UNSIGNED
          path: output/*
          if-no-files-found: error
