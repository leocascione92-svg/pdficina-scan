name: PDFicina Scan 0.1.16 - Build e test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-016-ocr.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Download sorgenti ufficiali di staging verificati
        shell: bash
        run: |
          set -euo pipefail
          ID="1C79qiLrnKlDU5bgZrXNQRkFfpa6WUH6U"
          EXPECTED="d3549b6b26abd7cb27efb6ac67d15839d00ee770a2198c8b2a491e7dee2a0c1d"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
          test -f PDFicinaScan_0.1.16/app/build.gradle
      - name: Regression JVM tests
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.16
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/it/pdficina/scan/{PerspectiveMath,FileNames,EdgeDetector,ArchiveNames,CaptureBatch,DocumentEnhancer,DocumentLighting,CameraFrameGeometry,PageOrder,OcrText,OcrPreprocess,OcrRanking,OcrAlternatives,FocusMetering}.java tests/{PerspectiveMathTest,FileNamesTest,EdgeDetectorTest,ArchiveNamesTest,CaptureBatchTest,DocumentEnhancerTest,DocumentLightingTest,CameraFrameGeometryTest,PageOrderTest,OcrTextTest,OcrPreprocessTest,OcrRankingTest,OcrAlternativesTest,FocusMeteringTest}.java
          for t in PerspectiveMathTest FileNamesTest EdgeDetectorTest ArchiveNamesTest CaptureBatchTest DocumentEnhancerTest DocumentLightingTest CameraFrameGeometryTest PageOrderTest OcrTextTest OcrPreprocessTest OcrRankingTest OcrAlternativesTest FocusMeteringTest; do java -cp build/tests "it.pdficina.scan.$t"; done
          for t in tests/*regression-check.py tests/test_sign_v2.py; do python3 "$t"; done
      - name: Compila APK release unsigned
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.16
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verifica e pubblica artefatto unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.16/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -qx classes.dex
          mkdir -p output
          cp "$APK" output/PDFicinaScan_0.1.16_UNSIGNED.apk
          (cd output && sha256sum PDFicinaScan_0.1.16_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - name: Consegna APK unsigned
        uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan-0.1.16-UNSIGNED
          path: output/*
          if-no-files-found: error
