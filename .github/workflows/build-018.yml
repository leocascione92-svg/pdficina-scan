name: PDFicina Scan 0.1.8 - Android e regressioni
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-018.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK API 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verifica e decomprimi i sorgenti
        shell: bash
        run: |
          set -euo pipefail
          ID="14NKQ3j24mtnLTG6iabJBjLsYCmLEDU-X"
          EXPECTED="e668d89a4461ed8d3f8d5aa366eb0cb4212aa7a70a073f71ecfdccdbee44431d"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
          test -f PDFicinaScan_0.1.8/app/build.gradle
      - name: JVM test e regressioni
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.8
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/it/pdficina/scan/{PerspectiveMath,FileNames,EdgeDetector,ArchiveNames,CaptureBatch,DocumentEnhancer,PageOrder}.java tests/{PerspectiveMathTest,FileNamesTest,EdgeDetectorTest,ArchiveNamesTest,CaptureBatchTest,DocumentEnhancerTest,PageOrderTest}.java
          for t in PerspectiveMathTest FileNamesTest EdgeDetectorTest ArchiveNamesTest CaptureBatchTest DocumentEnhancerTest PageOrderTest; do java -cp build/tests "it.pdficina.scan.$t"; done
          python3 tests/camera-regression-check.py
          python3 tests/consecutive-regression-check.py
          python3 tests/page-preview-regression-check.py
          python3 tests/test_sign_v2.py
      - name: Gradle release unsigned
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.8
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verifica APK e pubblica artefatto
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.8/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -qx classes.dex
          mkdir -p output
          cp "$APK" output/PDFicinaScan_0.1.8_UNSIGNED.apk
          (cd output && sha256sum PDFicinaScan_0.1.8_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan_0.1.8_UNSIGNED
          path: output/*
          if-no-files-found: error
