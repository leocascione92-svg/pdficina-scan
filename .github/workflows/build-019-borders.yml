name: PDFicina Scan 0.1.19 - Build e test contorni
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-019-borders.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Scarica sorgenti e verifica SHA-256
        shell: bash
        run: |
          set -euo pipefail
          ID="1f-OCBQOekmUdMnOYOAe-6HH3OaVh4RvZ"
          EXPECTED="bcaa6c79d2c7ca1f69c841903b1c650ee7319b7cdcece3f4dd670350216b433a"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
          test -f PDFicinaScan_0.1.19/app/build.gradle
      - name: Java test e regressioni della fotocamera
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.19
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/it/pdficina/scan/{ArchiveNames,BrightSheetEdges,CameraFrameGeometry,CaptureBatch,DocumentEnhancer,DocumentLighting,EdgeDetector,FileNames,FocusMetering,ImageRotation,OcrAlternatives,OcrPreprocess,OcrRanking,OcrText,PageOrder,PerspectiveMath}.java tests/*Test.java
          for t in tests/*Test.java; do java -cp build/tests "it.pdficina.scan.$(basename "$t" .java)"; done
          for t in tests/*regression-check.py tests/test_sign_v2.py; do python3 "$t"; done
      - name: Gradle assembleRelease unsigned
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.19
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verifica artefatto unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.19/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -qx classes.dex
          mkdir -p output
          cp "$APK" output/PDFicinaScan_0.1.19_UNSIGNED.apk
          (cd output && sha256sum PDFicinaScan_0.1.19_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan-0.1.19-UNSIGNED
          path: output/*
          if-no-files-found: error
