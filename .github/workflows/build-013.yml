name: PDFicina Scan 0.1.13 - Filtri e anteprima
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-013.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Sorgenti verificati
        shell: bash
        run: |
          set -euo pipefail
          ID="1JTddSND3LSB2LcegMPjt7mtaZQKJ04sl"
          EXPECTED="b24e5ac659964f109ee83ca5c4b31e6b3ec77aed9834df66efd334f5797924d2"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
      - name: Test logici e regressioni
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.13
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/it/pdficina/scan/{PerspectiveMath,FileNames,EdgeDetector,ArchiveNames,CaptureBatch,DocumentEnhancer,PageOrder,CameraFrameGeometry,DocumentLighting}.java tests/{PerspectiveMathTest,FileNamesTest,EdgeDetectorTest,ArchiveNamesTest,CaptureBatchTest,DocumentEnhancerTest,PageOrderTest,CameraFrameGeometryTest,DocumentLightingTest}.java
          for T in PerspectiveMathTest FileNamesTest EdgeDetectorTest ArchiveNamesTest CaptureBatchTest DocumentEnhancerTest PageOrderTest CameraFrameGeometryTest DocumentLightingTest; do java -cp build/tests "it.pdficina.scan.$T"; done
          for TEST in tests/*regression-check.py tests/test_sign_v2.py; do python3 "$TEST"; done
      - name: Compila Android
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.13
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Prepara APK unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.13/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -qx classes.dex
          mkdir -p output
          cp "$APK" output/PDFicinaScan_0.1.13_UNSIGNED.apk
          (cd output && sha256sum PDFicinaScan_0.1.13_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan-0.1.13-UNSIGNED
          path: output/*
          if-no-files-found: error
