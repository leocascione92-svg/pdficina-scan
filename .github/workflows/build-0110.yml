name: PDFicina Scan 0.1.10 - Preview installabile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-0110.yml']
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Scarica sorgenti v0.1.10 e verifica hash
        shell: bash
        run: |
          set -euo pipefail
          ID="1HqORj-DwtYK77gr-rP9ZAEWWHTDgAEiH"
          EXPECTED="b317ef80313f57f04f5ef713ca19dc272f267188df34122b99067a202a830d43"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
      - name: Test regressione JVM e statici
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.10
          mkdir -p build/jvm
          javac -d build/jvm app/src/main/java/it/pdficina/scan/{PerspectiveMath,FileNames,EdgeDetector,ArchiveNames,CaptureBatch,DocumentEnhancer,PageOrder,PdfExportOptions}.java tests/{PerspectiveMathTest,FileNamesTest,EdgeDetectorTest,ArchiveNamesTest,CaptureBatchTest,DocumentEnhancerTest,PageOrderTest,PdfExportOptionsTest}.java
          for t in PerspectiveMathTest FileNamesTest EdgeDetectorTest ArchiveNamesTest CaptureBatchTest DocumentEnhancerTest PageOrderTest PdfExportOptionsTest; do java -cp build/jvm "it.pdficina.scan.$t"; done
          for f in tests/*regression-check.py tests/test_sign_v2.py; do python3 "$f"; done
      - name: Compila APK debug parallelo e release unsigned
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.10
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verifica struttura e firma della PREVIEW
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp PDFicinaScan_0.1.10/app/build/outputs/apk/debug/app-debug.apk output/PDFicinaScan_0.1.10_PREVIEW_Installabile.apk
          cp PDFicinaScan_0.1.10/app/build/outputs/apk/release/app-release-unsigned.apk output/PDFicinaScan_0.1.10_RELEASE_UNSIGNED.apk
          APK=output/PDFicinaScan_0.1.10_PREVIEW_Installabile.apk
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 29 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee output/badging.txt
          grep -F "name='it.pdficina.scan.preview'" output/badging.txt
          grep -F "versionCode='11'" output/badging.txt
          (cd output && sha256sum *.apk > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan-0.1.10-PREVIEW-APK
          path: output/*
          if-no-files-found: error
      - name: Pubblica prerelease PREVIEW indipendente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.10-preview"
          FILE="output/PDFicinaScan_0.1.10_PREVIEW_Installabile.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" output/SHA256.txt --clobber
          else
            gh release create "$TAG" "$FILE" output/SHA256.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.10 PREVIEW (installazione parallela)" --notes "APK DEBUG installabile come app separata it.pdficina.scan.preview, NON aggiorna la versione ufficiale. Include preview Camera2 non coperta dalle barre, rotazione pagine, 3 formati e 3 qualita PDF, rinomina archivio. Collaudo Galaxy S24 ancora da completare. La firma della release ufficiale resta quella privata persistente e NON viene sostituita." --prerelease
          fi
