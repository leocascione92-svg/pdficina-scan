name: Verifica e pubblica PDFicina Scan 0.1.12
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-012.yml']
permissions:
  contents: write
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Installa Android build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Recupera ZIPMASTER e verifica SHA256
        shell: bash
        run: |
          set -euo pipefail
          ID="1ZSvNdg4cUW4zhD-ZAWCqpbNeSGQS1Q4u"
          EXPECTED="995e25300b01e55580287129874c494b1a675857a2a2c1e769b88a28da860bc4"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o official.zip; then
              if echo "$EXPECTED  official.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  official.zip" | sha256sum -c -
          unzip -tq official.zip
          unzip -q official.zip 'PDFicinaScan_0.1.12/release/*'
          mkdir -p release
          cp PDFicinaScan_0.1.12/release/PDFicinaScan_0.1.12_GalaxyS24.apk release/
          cp PDFicinaScan_0.1.12/release/SHA256_APK.txt release/
          (cd release && sha256sum -c SHA256_APK.txt)
      - name: Verifica firma e compatibilita Android
        shell: bash
        run: |
          set -euo pipefail
          APK=release/PDFicinaScan_0.1.12_GalaxyS24.apk
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs "$APK" | tee official_signature.txt
          grep -qi '7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236' official_signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee official_badging.txt
          grep -F "versionCode='13'" official_badging.txt
          grep -F "versionName='0.1.12'" official_badging.txt
          grep -F "name='it.pdficina.scan'" official_badging.txt
      - name: Pubblica APK verificato
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.12-prealfa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/PDFicinaScan_0.1.12_GalaxyS24.apk release/SHA256_APK.txt --clobber
          else
            gh release create "$TAG" release/PDFicinaScan_0.1.12_GalaxyS24.apk release/SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.12 PRE-ALFA" --notes "Toolbar Griglia/Timer separata dal riquadro Camera2; guida formato A4 opzionale e non distruttiva. Tutte le funzioni 0.1.11 mantenute. Stesso certificato release persistente. Test S24 ancora richiesti." --prerelease
          fi
