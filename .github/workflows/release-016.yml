name: Verifica APK PDFicina Scan 0.1.6 e pubblica Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-016.yml'
permissions:
  contents: write
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Installa verifica APK ufficiale
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Scarica ZIPMASTER ufficiale e verifica SHA256
        shell: bash
        run: |
          set -euo pipefail
          ID=1ZSvNdg4cUW4zhD-ZAWCqpbNeSGQS1Q4u
          EXPECTED=ba484304dd02376c01772d2809869b2f1cefa0ca1b967bac5067cd5332ed4fc1
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o master.zip; then
              if echo "$EXPECTED  master.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  master.zip" | sha256sum -c -
          unzip -tq master.zip
          unzip -q master.zip
      - name: Verifica integrita APK e certificato firma
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.6/release/PDFicinaScan_0.1.6_GalaxyS24.apk
          test -s "$APK"
          unzip -tq "$APK"
          echo "6cef56a8825bccad71e0efb90baba191237d1d0ebde04eb9a1d3e4caff20f638  $APK" | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs "$APK" | tee apksigner.log
          grep -qi "7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236" apksigner.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee aapt.log
          grep -q "name='it.pdficina.scan'" aapt.log
          grep -q "versionCode='7'" aapt.log
          mkdir -p release
          cp "$APK" release/PDFicinaScan_0.1.6_GalaxyS24.apk
          (cd release && sha256sum PDFicinaScan_0.1.6_GalaxyS24.apk > SHA256_APK.txt)
      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan_0.1.6_VERIFIED
          path: release/*
          if-no-files-found: error
      - name: Pubblica APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.6-prealfa
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/PDFicinaScan_0.1.6_GalaxyS24.apk release/SHA256_APK.txt --clobber
          else
            gh release create "$TAG" release/PDFicinaScan_0.1.6_GalaxyS24.apk release/SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.6 PRE-ALFA" --notes "Novita: archivio PDF offline, ricerca per nome, apertura e condivisione. Test su Galaxy S24 delle nuove funzioni ancora richiesti. Firmato con certificato release stabile della 0.1.4 e 0.1.5." --prerelease
          fi
