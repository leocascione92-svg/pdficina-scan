name: PDFicina Scan 0.1.4 - verifica e build unsigned
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-014.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Ottieni il sorgente verificato
        shell: bash
        run: |
          set -euo pipefail
          ID=1J6wDWpP7QHbNDyX3-NscK9Yny8or1tuB
          EXPECTED=4659fd47a354930eada6b60a65aebc03d01782a625edc7b47e50f71c8cbb2e60
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
      - name: Test Java logici
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.4
          mkdir -p build/testclasses
          javac -d build/testclasses app/src/main/java/it/pdficina/scan/PerspectiveMath.java app/src/main/java/it/pdficina/scan/FileNames.java tests/PerspectiveMathTest.java tests/FileNamesTest.java
          java -cp build/testclasses it.pdficina.scan.PerspectiveMathTest
          java -cp build/testclasses it.pdficina.scan.FileNamesTest
          python3 tests/camera-regression-check.py
          python3 tests/test_sign_v2.py
      - name: Compila release non firmata
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.4
          gradle --no-daemon :app:assembleRelease
          find app/build/outputs/apk/release -type f -maxdepth 2 -print
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Controlla APK
        shell: bash
        run: |
          unzip -tq PDFicinaScan_0.1.4/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p output
          cp PDFicinaScan_0.1.4/app/build/outputs/apk/release/app-release-unsigned.apk output/PDFicinaScan_0.1.4_UNSIGNED.apk
          (cd output && sha256sum PDFicinaScan_0.1.4_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan_0.1.4_UNSIGNED
          path: output/*
          if-no-files-found: error

      - name: Recupera verificatore ufficiale Android
        run: |
          mkdir -p verification_tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verification_tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Android_apksigner_35
          path: verification_tools/apksigner.jar
          if-no-files-found: error
