name: Verifica APK PDFicina Scan 0.1.7 e pubblica Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-017.yml']
permissions:
  contents: write
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Android build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Scarica APK firmato con checksum
        shell: bash
        run: |
          set -euo pipefail
          ID="1ny_caxWHMtvQd0t0Cg9scB7RbiAaK11C"
          EXPECTED="e0056cdab1ae19507b81628ac95ba15bbfc3b9e56841f083ea5684a37c2c85ae"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o PDFicinaScan_0.1.7_GalaxyS24.apk; then
              if echo "$EXPECTED  PDFicinaScan_0.1.7_GalaxyS24.apk" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  PDFicinaScan_0.1.7_GalaxyS24.apk" | sha256sum -c -
          unzip -tq PDFicinaScan_0.1.7_GalaxyS24.apk
      - name: Verifica ufficiale Android APK Signature Scheme v2
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs PDFicinaScan_0.1.7_GalaxyS24.apk | tee verify.txt
          grep -qi '7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236' verify.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging PDFicinaScan_0.1.7_GalaxyS24.apk | head -1 | tee badging.txt
          grep -q "name='it.pdficina.scan'" badging.txt
          grep -q "versionCode='8'" badging.txt
          grep -q "versionName='0.1.7'" badging.txt
          echo 'e0056cdab1ae19507b81628ac95ba15bbfc3b9e56841f083ea5684a37c2c85ae  PDFicinaScan_0.1.7_GalaxyS24.apk' > SHA256_APK.txt
      - name: Crea GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.7-prealfa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PDFicinaScan_0.1.7_GalaxyS24.apk SHA256_APK.txt --clobber
          else
            gh release create "$TAG" PDFicinaScan_0.1.7_GalaxyS24.apk SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.7 PRE-ALFA" --notes "Scanner Android offline. Serie Camera2 fino a 40 fotografie, ritaglio sequenziale e filtro Testo morbido. APK firmato con certificato permanente 0.1.4-0.1.6. Da collaudare sul Samsung Galaxy S24; originali indipendenti dalla sessione." --prerelease
          fi
