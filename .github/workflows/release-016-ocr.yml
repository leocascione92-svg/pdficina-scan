name: PDFicina Scan 0.1.16 - Verifica APK e Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-016-ocr.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Scarica APK firmato e verifica SHA256
        shell: bash
        run: |
          set -euo pipefail
          ID="1RMy35dVT-reny6AN42KS9aIGKX-MrhxV"
          EXPECTED="c50990be2cdea700e8321786d890c22d2233b028240f5f8f15ae12c022d45b43"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 3 --connect-timeout 20 "$URL" -o signed.zip; then
              if echo "$EXPECTED  signed.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  signed.zip" | sha256sum -c -
          unzip -tq signed.zip
          mkdir -p release
          unzip -q signed.zip -d release
          (cd release && sha256sum -c SHA256_APK.txt)
      - name: Verifica ufficiale Android
        shell: bash
        run: |
          set -euo pipefail
          APK=release/PDFicinaScan_0.1.16_GalaxyS24.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs "$APK" | tee signature.txt
          grep -qi '7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236' signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -F "name='it.pdficina.scan'" badging.txt
          grep -F "versionCode='17'" badging.txt
          grep -F "versionName='0.1.16'" badging.txt
          unzip -Z1 "$APK" | grep -qx classes.dex
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.1.16-prealfa
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/PDFicinaScan_0.1.16_GalaxyS24.apk release/SHA256_APK.txt --clobber
          else
            gh release create "$TAG" release/PDFicinaScan_0.1.16_GalaxyS24.apk release/SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.16 — Autofocus + OCR comparativo" --notes "Build Android 0.1.16. Tap per messa a fuoco Camera2 con fallback continuo; confronto OCR offline 4 elaborazioni e correzione manuale; firma persistente. Compilazione e firma verificati, prova sul Galaxy S24 ancora da eseguire." --prerelease
          fi
