name: PDFicina Scan 0.1.14 - OCR offline Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-014-ocr.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Recupera sorgenti e verifica SHA256
        shell: bash
        run: |
          set -euo pipefail
          ID="1ZSvNdg4cUW4zhD-ZAWCqpbNeSGQS1Q4u"
          EXPECTED="d47102947c7e93fa26633579c84ee28a4db92599f752d2f3ee725f0e76793545"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 20 "$URL" -o source.zip; then
              if echo "$EXPECTED  source.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  source.zip" | sha256sum -c -
          unzip -tq source.zip
          unzip -q source.zip
      - name: Traineddata italiani e inglesi incorporati offline
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.14
          mkdir -p app/src/main/assets/tessdata
          REV="87416418657359cb625c412a48b6e1d6d41c29bd"
          for LANG in ita eng; do
            curl -fL --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/${REV}/${LANG}.traineddata" -o "app/src/main/assets/tessdata/${LANG}.traineddata"
            test "$(stat -c%s "app/src/main/assets/tessdata/${LANG}.traineddata")" -gt 100000
          done
          sha256sum app/src/main/assets/tessdata/*.traineddata > MODELS_SHA256.txt
          cat MODELS_SHA256.txt
      - name: Test e regressioni
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.14
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/it/pdficina/scan/{ArchiveNames,CameraFrameGeometry,CaptureBatch,DocumentEnhancer,DocumentLighting,EdgeDetector,FileNames,PageOrder,PerspectiveMath,OcrText}.java tests/{ArchiveNamesTest,CameraFrameGeometryTest,CaptureBatchTest,DocumentEnhancerTest,DocumentLightingTest,EdgeDetectorTest,FileNamesTest,PageOrderTest,PerspectiveMathTest,OcrTextTest}.java
          for t in ArchiveNamesTest CameraFrameGeometryTest CaptureBatchTest DocumentEnhancerTest DocumentLightingTest EdgeDetectorTest FileNamesTest PageOrderTest PerspectiveMathTest OcrTextTest; do java -cp build/tests "it.pdficina.scan.$t"; done
          for f in tests/*regression-check.py; do python3 "$f"; done
          python3 tests/test_sign_v2.py
      - name: APK release
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.14
          gradle --no-daemon :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: APK completo con modelli e lib native
        shell: bash
        run: |
          set -euo pipefail
          cd PDFicinaScan_0.1.14
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -qx 'classes.dex'
          unzip -Z1 "$APK" | grep -qx 'assets/tessdata/ita.traineddata'
          unzip -Z1 "$APK" | grep -qx 'assets/tessdata/eng.traineddata'
          unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/'
          mkdir -p ../output/tessdata
          cp "$APK" ../output/PDFicinaScan_0.1.14_UNSIGNED.apk
          cp app/src/main/assets/tessdata/*.traineddata ../output/tessdata/
          cp MODELS_SHA256.txt ../output/
          (cd ../output && sha256sum PDFicinaScan_0.1.14_UNSIGNED.apk > SHA256_UNSIGNED.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan-0.1.14-UNSIGNED-OCR
          path: output/**
          if-no-files-found: error
