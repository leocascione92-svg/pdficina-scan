name: Verifica e pubblica PDFicina Scan 0.1.8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-018.yml'

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Download unsigned from verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p unsigned
          gh run download 39016762973 -n PDFicinaScan_0.1.8_UNSIGNED -D unsigned
          echo 'b06af84f9c616cf289204cae93a7f8be0914ac1c8d2383405b1f767a5709f9bf  unsigned/PDFicinaScan_0.1.8_UNSIGNED.apk' | sha256sum -c -
      - name: Reassemble pre-signed release without any private key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,struct
          from pathlib import Path
          unsigned=Path('unsigned/PDFicinaScan_0.1.8_UNSIGNED.apk').read_bytes()
          block=base64.b64decode(Path('.github/release-data/apk-signature-v018.b64').read_text().strip(),validate=True)
          assert block[-16:]==b'APK Sig Block 42'
          pos=len(unsigned)-22
          while pos>=0 and unsigned[pos:pos+4]!=b'PK\x05\x06':pos-=1
          assert pos>=0
          offset=struct.unpack_from('<I',unsigned,pos+16)[0]
          assert len(block)==2044
          end=bytearray(unsigned[pos:])
          struct.pack_into('<I',end,16,offset+len(block))
          apk=unsigned[:offset]+block+unsigned[offset:pos]+end
          expected='ea6d88edf3951b31d3e6999f127a5a9b3887406a2b73cd48c1105e2336106681'
          assert hashlib.sha256(apk).hexdigest()==expected
          Path('PDFicinaScan_0.1.8_GalaxyS24.apk').write_bytes(apk)
          Path('SHA256_APK.txt').write_text(expected+'  PDFicinaScan_0.1.8_GalaxyS24.apk\n')
          print('Recreated signed APK SHA256:',expected)
          PY
      - name: Verifica ufficiale firma, certificato e versione
        shell: bash
        run: |
          set -euo pipefail
          APK=PDFicinaScan_0.1.8_GalaxyS24.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs "$APK" | tee official_verify.txt
          grep -qi '7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236' official_verify.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -6 | tee manifest_dump.txt
          grep -q "name='it.pdficina.scan'" manifest_dump.txt
          grep -q "versionCode='9'" manifest_dump.txt
          grep -q "versionName='0.1.8'" manifest_dump.txt
      - name: Pubblica release APK verificato
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.1.8-prealfa
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PDFicinaScan_0.1.8_GalaxyS24.apk SHA256_APK.txt --clobber
          else
            gh release create "$TAG" PDFicinaScan_0.1.8_GalaxyS24.apk SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.8 PRE-ALFA" --notes "Anteprima zoom, confronto originale/scansione, spostamento diretto e duplicazione pagine. Conserva scansione serie, filtri e archivio. Firma Android v2 invariata. Richiede collaudo Galaxy S24." --prerelease
          fi
      - name: Prepara ZIPMASTER completo da baseline e nuovi sorgenti
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          src=Path('previous.zip')
          baseid='1ZSvNdg4cUW4zhD-ZAWCqpbNeSGQS1Q4u'
          urls=[
              f'https://drive.usercontent.google.com/download?id={baseid}&export=download&confirm=t',
              f'https://drive.google.com/uc?export=download&id={baseid}'
          ]
          for url in urls:
              r=subprocess.run(['curl','-fsSL','--retry','2','--connect-timeout','20',url,'-o',str(src)])
              if r.returncode==0 and hashlib.sha256(src.read_bytes()).hexdigest()=='5c88257a9e2d4143ad8e8ca5d86c49ed7de25a314938b5ae30595cfed559e9f3':break
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='5c88257a9e2d4143ad8e8ca5d86c49ed7de25a314938b5ae30595cfed559e9f3', 'Baseline ZIPMASTER changed during release'
          sid='14NKQ3j24mtnLTG6iabJBjLsYCmLEDU-X'
          srcurls=[
              f'https://drive.usercontent.google.com/download?id={sid}&export=download&confirm=t',
              f'https://drive.google.com/uc?export=download&id={sid}'
          ]
          for url in srcurls:
              r=subprocess.run(['curl','-fsSL','--retry','2','--connect-timeout','20',url,'-o','source.zip'])
              if r.returncode==0 and hashlib.sha256(Path('source.zip').read_bytes()).hexdigest()=='e668d89a4461ed8d3f8d5aa366eb0cb4212aa7a70a073f71ecfdccdbee44431d':break
          assert hashlib.sha256(Path('source.zip').read_bytes()).hexdigest()=='e668d89a4461ed8d3f8d5aa366eb0cb4212aa7a70a073f71ecfdccdbee44431d'
          PY
          unzip -tq previous.zip
          unzip -tq source.zip
          mkdir -p old stage package
          unzip -q previous.zip -d old
          unzip -q source.zip -d stage
          mkdir -p package/PDFicinaScan_0.1.8
          cp -a stage/PDFicinaScan_0.1.8/. package/PDFicinaScan_0.1.8/
          mkdir -p package/PDFicinaScan_0.1.8/{release,signing,history}
          cp old/PDFicinaScan_0.1.7/signing/PDFicinaScan_RELEASE_KEY_ENCRYPTED.p12 package/PDFicinaScan_0.1.8/signing/
          cp previous.zip package/PDFicinaScan_0.1.8/history/PDFicinaScan_0.1.7_ZIPMASTER.zip
          cp PDFicinaScan_0.1.8_GalaxyS24.apk SHA256_APK.txt package/PDFicinaScan_0.1.8/release/
          cp official_verify.txt manifest_dump.txt package/PDFicinaScan_0.1.8/docs/
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('package/PDFicinaScan_0.1.8')
          (root/'docs/BUILD_STATUS.md').write_text('0.1.8 Android Gradle SUCCESS run 39016762973. Official apksigner/aapt SUCCESS via release-018. Certificate SHA256 7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236. versionCode 9. Physical S24 test pending.\n')
          report=root/'docs/TEST_REPORT.md'
          report.write_text('0.1.8: 69/69 JVM tests, 50/50 static regression, APK officially validated; real S24 device checks PENDING.\n\n'+report.read_text())
          policy=root/'docs/SIGNING_POLICY.md'
          policy.write_text(policy.read_text()+'\n## 0.1.8\nStesso certificato 0.1.4–0.1.7 e versionCode 9, Android apksigner verificato; mai copiare password in repository.\n')
          out=root/'docs/SHA256SUMS.txt'
          lines=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p!=out:
                  lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root)))
          out.write_text('\n'.join(lines)+'\n')
          assert (root/'history/PDFicinaScan_0.1.7_ZIPMASTER.zip').is_file()
          assert (root/'signing/PDFicinaScan_RELEASE_KEY_ENCRYPTED.p12').is_file()
          assert not any('PASSWORD' in p.name.upper() for p in root.rglob('*') if p.is_file())
          print('ZIPMASTER content files:',len(lines))
          PY
      - name: Pubblica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan_0.1.8_APK
          path: |
            PDFicinaScan_0.1.8_GalaxyS24.apk
            SHA256_APK.txt
          if-no-files-found: error
      - name: Pubblica ZIPMASTER aggiornabile su Drive
        uses: actions/upload-artifact@v4
        with:
          name: PDFicinaScan_0.1.8_ZIPMASTER
          path: package/*
          include-hidden-files: true
          if-no-files-found: error
