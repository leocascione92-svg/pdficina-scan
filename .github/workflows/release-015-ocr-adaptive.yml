name: Verifica firma e pubblica PDFicina Scan 0.1.15
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-015-ocr-adaptive.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Android build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Recupera ZIPMASTER ufficiale e verifica SHA256
        shell: bash
        run: |
          set -euo pipefail
          ID="1ZSvNdg4cUW4zhD-ZAWCqpbNeSGQS1Q4u"
          EXPECTED="3c6372ee05caeba0a155b93d6af403df4466670708409f36de5caf5b42de132f"
          for URL in "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" "https://drive.google.com/uc?export=download&id=${ID}"; do
            if curl -fsSL --retry 2 --connect-timeout 30 "$URL" -o archive.zip; then
              if echo "$EXPECTED  archive.zip" | sha256sum -c -; then break; fi
            fi
          done
          echo "$EXPECTED  archive.zip" | sha256sum -c -
          unzip -tq archive.zip
          unzip -p archive.zip PDFicinaScan_0.1.15/release/PDFicinaScan_0.1.15_GalaxyS24.apk > PDFicinaScan_0.1.15_GalaxyS24.apk
          unzip -p archive.zip PDFicinaScan_0.1.15/release/SHA256_APK.txt > SHA256_APK.txt
          sha256sum -c SHA256_APK.txt
      - name: Verifica reale apksigner e AAPT
        shell: bash
        run: |
          set -euo pipefail
          APK="PDFicinaScan_0.1.15_GalaxyS24.apk"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 --print-certs "$APK" | tee signing.txt
          grep -qi "7ac1b5e306473b2403644ae14e3af10c6a39b7e1e1b5ccba381450d4b171a236" signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -F "name='it.pdficina.scan'" badging.txt
          grep -F "versionCode='16'" badging.txt
          grep -F "versionName='0.1.15'" badging.txt
          unzip -Z1 "$APK" | grep -qx "classes.dex"
          unzip -Z1 "$APK" | grep -q '^assets/tessdata/ita.traineddata$'
          unzip -Z1 "$APK" | grep -q '^assets/tessdata/eng.traineddata$'
      - name: Crea release PRE-ALFA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.15-prealfa
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PDFicinaScan_0.1.15_GalaxyS24.apk SHA256_APK.txt --clobber
          else
            gh release create "$TAG" PDFicinaScan_0.1.15_GalaxyS24.apk SHA256_APK.txt --target "$GITHUB_SHA" --title "PDFicina Scan 0.1.15 PRE-ALFA — OCR migliorato" --notes "OCR offline a confronto su 3 varianti temporanee, selezione mediante confidenza Tesseract, testo correggibile prima della copia. Preserve Camera2, Serie, PDF, archivio. Firma stabile 0.1.14. Test fisico S24 OCR 0.1.15 ancora necessario." --prerelease
          fi
